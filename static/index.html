<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分支访谈脚本编辑器</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <!-- sidebar -->
  <aside class="sidebar">
    <h1>分支访谈编辑器<small>Branch Interview Editor</small></h1>
    <div class="btns">
      <button class="primary" id="btnNew">＋ 新建脚本</button>
      <button id="btnSample">载入示例脚本</button>
    </div>
    <div class="list" id="scriptList"></div>
  </aside>

  <!-- main -->
  <div class="main">
    <div class="toolbar">
      <input class="title-input" id="scriptName" value="" placeholder="脚本名称">
      <button id="btnAddNode">＋ 添加问题节点</button>
      <button id="btnUndo" title="撤销 (Ctrl/Cmd+Z)" disabled>↶ 撤销</button>
      <button id="btnRedo" title="重做 (Shift+Ctrl/Cmd+Z)" disabled>↷ 重做</button>
      <button class="primary" id="btnSave">保存 (Ctrl+S)</button>
      <div class="spacer"></div>
      <button id="btnPreview">▶ 运行预览</button>
      <button id="btnCoverage" title="按已保存运行记录统计各选项被选择次数">📊 分支覆盖</button>
      <button id="btnShare">🔗 只读分享</button>
      <button id="btnExport">导出 JSON</button>
      <button id="btnImport">导入 JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="toolbar" style="padding-top:6px;padding-bottom:6px;">
      <div class="status" id="status"></div>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <div id="world">
        <svg id="edges" width="4000" height="3000">
          <path id="tempEdge" class="edge dangle" style="display:none;pointer-events:none"></path>
        </svg>
      </div>
      <div class="connecting-tip" id="connectingTip">松开鼠标连接到目标节点（ESC 取消）</div>
      <div class="canvas-hint">
        拖动节点标题移动 · 拖拽选项右侧圆点连线 · 点击连线修改/删除<br>
        Ctrl/Cmd+Z 撤销 · Shift+Ctrl/Cmd+Z 重做 · 空白处拖动平移画布 ·
        <b style="color:var(--cycle)">红=环路</b> /
        <b style="color:var(--orphan)">橙虚线=孤立</b> /
        <b style="color:var(--uncovered)">紫=未覆盖出口</b> ·
        <b style="color:var(--coverage)">📊 分支覆盖=选项被选择次数</b>
      </div>
    </div>
  </div>

  <!-- inspector -->
  <aside class="inspector" id="inspector"></aside>
</div>

<!-- preview modal -->
<div class="modal-mask" id="previewModal">
  <div class="modal wide">
    <header>运行预览<span class="close" data-close="previewModal">✕</span></header>
    <div class="body">
      <div class="preview-grid">
        <div id="previewCard"></div>
        <div>
          <div class="path-list">
            <h4>回答路径记录</h4>
            <div id="runPath"></div>
          </div>
          <div style="margin-top:10px"><button id="runRestart">↺ 重新开始</button></div>
        </div>
      </div>
    </div>
    <footer>
      <button data-close="previewModal">关闭</button>
    </footer>
  </div>
</div>

<!-- coverage modal -->
<div class="modal-mask" id="coverageModal">
  <div class="modal wide">
    <header>分支覆盖统计<span class="close" data-close="coverageModal">✕</span></header>
    <div class="body">
      <div id="coverageSummary"></div>
      <div id="coverageList"></div>
    </div>
    <footer>
      <button id="coverageRefresh">↻ 刷新统计</button>
      <button data-close="coverageModal">关闭</button>
    </footer>
  </div>
</div>

<!-- share modal -->
<div class="modal-mask" id="shareModal">
  <div class="modal">
    <header>只读分享链接<span class="close" data-close="shareModal">✕</span></header>
    <div class="body">
      <p style="margin:0 0 12px;color:var(--muted);font-size:13px">
        链接打开的是生成分享时脚本的只读快照（受访者视角），后续编辑不影响已分享内容。</p>
      <div class="share-link-row">
        <input id="shareLink" readonly>
        <button id="shareCopy">复制</button>
      </div>
      <div style="margin-top:12px"><button class="primary" id="shareOpen">在新标签页打开</button></div>
    </div>
    <footer><button data-close="shareModal">关闭</button></footer>
  </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/app.js"></script>
<script>
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-close]");
    if (b) closeModal(b.dataset.close);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      document.querySelectorAll(".modal-mask.open").forEach((m) => m.classList.remove("open"));
    }
  });
</script>
</body>
</html>
